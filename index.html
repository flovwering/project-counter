 <title>Project Counter</title>
  <!-- Google Fonts: Fredoka (Angka Playful) & Plus Jakarta Sans (Teks Utama) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Plus+Jakarta+Sans:wght@500;600;700&display=swap" rel="stylesheet" />
  <style>
    /* ==========================================
       VARIABEL WARNA: TAMAN BUNGA WARNA-WARNI
       Sakura Pink, Buttercup Yellow, Lavender Lilac, Sky Bluebell, Peach Coral & Sage Leaf
       ========================================== */
    :root {
      --bg-main: #FFF8F3;
      --bg-sakura: rgba(255, 143, 171, 0.22);
      --bg-buttercup: rgba(255, 209, 102, 0.24);
      --bg-lavender: rgba(184, 146, 255, 0.20);
      --bg-bluebell: rgba(114, 189, 255, 0.20);
      --card-bg: #FFFDFB;
      --card-border: #F5C6D6;
      --text-primary: #572742;
      --text-secondary: #8C5A75;
      /* Gradien Angka: Harmoni Bunga Taman (Coral Rose -> Buttercup Marigold -> Lavender Bloom) */
      --num-start: #E84A7F;
      --num-mid: #F28C38;
      --num-end: #8E54E9;
      --num-shadow: rgba(232, 74, 127, 0.24);
      --btn-plus: #F2648D;
      --btn-plus-hover: #E04E78;
      --btn-minus: #5EA683;
      --btn-minus-hover: #4C9170;
      --btn-step-active: #F2A341;
      --btn-reset: #9A72CF;
      --btn-reset-hover: #855DBA;
      --surface-soft: #FFF2F6;
      --progress-bg: #F6DCE5;
      --accent-glow: rgba(242, 100, 141, 0.28);
      --shadow-card: 0 20px 45px -12px rgba(142, 84, 233, 0.14), 0 8px 20px -8px rgba(242, 100, 141, 0.16);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: var(--bg-main);
      background-image:
        radial-gradient(circle at 12% 16%, var(--bg-sakura) 0%, transparent 36%),
        radial-gradient(circle at 88% 18%, var(--bg-buttercup) 0%, transparent 36%),
        radial-gradient(circle at 15% 86%, var(--bg-bluebell) 0%, transparent 38%),
        radial-gradient(circle at 86% 84%, var(--bg-lavender) 0%, transparent 38%),
        radial-gradient(#F2C8D8 1.4px, transparent 1.4px);
      background-size: 100% 100%, 100% 100%, 100% 100%, 100% 100%, 22px 22px;
      color: var(--text-primary);
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      overflow-x: hidden;
      position: relative;
    }

    /* Bunga Latar Belakang Lembut Melayang */
    .bg-garden {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    .bg-blossom {
      position: absolute;
      opacity: 0.42;
      animation: gentleSway 7s ease-in-out infinite alternate;
    }

    .bg-blossom.b1 { top: 6%; left: 7%; width: 54px; animation-delay: 0s; }
    .bg-blossom.b2 { top: 10%; right: 8%; width: 48px; animation-delay: 1.5s; }
    .bg-blossom.b3 { bottom: 8%; left: 9%; width: 50px; animation-delay: 2.5s; }
    .bg-blossom.b4 { bottom: 7%; right: 7%; width: 56px; animation-delay: 1s; }

    @keyframes gentleSway {
      0%   { transform: translateY(0) rotate(-6deg) scale(0.98); }
      100% { transform: translateY(-10px) rotate(8deg) scale(1.04); }
    }

    /* Ukuran ringkas & proporsional di desktop (max-width 375px) */
    .card {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 375px;
      background: var(--card-bg);
      border: 2px solid var(--card-border);
      border-radius: 28px;
      padding: 20px 20px 18px;
      box-shadow: var(--shadow-card);
      overflow: hidden;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    /* Hiasan Buket Bunga Warna-warni di Sudut Kartu */
    .corner-decor {
      position: absolute;
      pointer-events: none;
      z-index: 0;
      transition: transform 0.55s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .corner-top-right {
      top: -10px;
      right: -10px;
      width: 112px;
      height: 112px;
    }

    .corner-top-left {
      top: -10px;
      left: -10px;
      width: 82px;
      height: 82px;
    }

    .corner-bottom-left {
      bottom: -12px;
      left: -12px;
      width: 108px;
      height: 108px;
    }

    .corner-bottom-right {
      bottom: -10px;
      right: -10px;
      width: 80px;
      height: 80px;
    }

    .card.bloom .corner-top-right {
      transform: rotate(12deg) scale(1.12);
    }

    .card.bloom .corner-top-left {
      transform: rotate(-14deg) scale(1.1);
    }

    .card.bloom .corner-bottom-left {
      transform: rotate(-12deg) scale(1.12);
    }

    .card.bloom .corner-bottom-right {
      transform: rotate(14deg) scale(1.1);
    }

    .content {
      position: relative;
      z-index: 1;
    }

    /* Header: Bar Kontrol Atas + Judul Rename + Subjudul */
    .header {
      margin-bottom: 12px;
    }

    .header-top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      margin-bottom: 10px;
    }

    .badge-save {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: rgba(255, 253, 251, 0.88);
      backdrop-filter: blur(4px);
      border: 1px solid var(--card-border);
      padding: 5px 10px;
      border-radius: 999px;
      font-size: 0.7rem;
      font-weight: 700;
      color: var(--text-secondary);
      white-space: nowrap;
    }

    .dot-live {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--btn-minus);
      box-shadow: 0 0 0 2.5px rgba(94, 166, 131, 0.24);
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .icon-btn {
      width: 34px;
      height: 34px;
      border-radius: 11px;
      border: 1.5px solid var(--card-border);
      background: rgba(255, 253, 251, 0.9);
      color: var(--text-primary);
      cursor: pointer;
      display: grid;
      place-items: center;
      font-size: 0.95rem;
      transition: transform 0.18s ease, background-color 0.2s ease;
    }

    .icon-btn:hover {
      transform: translateY(-1.5px);
    }

    .icon-btn:active {
      transform: scale(0.92);
    }

    /* Judul Counter yang Bisa Di-rename + Subjudul */
    .title-area {
      text-align: center;
      padding: 2px 4px;
    }

    .title-edit-wrapper {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      max-width: 100%;
      background: rgba(255, 242, 246, 0.85);
      border: 1.5px dashed transparent;
      border-radius: 12px;
      padding: 3px 10px;
      transition: border-color 0.2s ease, background-color 0.2s ease;
    }

    .title-edit-wrapper:hover,
    .title-edit-wrapper:focus-within {
      border-color: var(--card-border);
      background: var(--card-bg);
    }

    .counter-title-input {
      font-family: 'Fredoka', sans-serif;
      font-size: 1.12rem;
      font-weight: 700;
      color: var(--text-primary);
      background: transparent;
      border: none;
      outline: none;
      text-align: center;
      width: 195px;
      max-width: 65vw;
      text-overflow: ellipsis;
    }

    .edit-pencil-btn {
      border: none;
      background: transparent;
      color: var(--text-secondary);
      font-size: 0.85rem;
      cursor: pointer;
      padding: 2px;
      line-height: 1;
      opacity: 0.75;
      transition: opacity 0.2s ease, transform 0.2s ease;
    }

    .edit-pencil-btn:hover {
      opacity: 1;
      transform: scale(1.12);
    }

    .brand-subtitle {
      margin-top: 4px;
      font-size: 0.74rem;
      font-weight: 600;
      color: var(--text-secondary);
      letter-spacing: 0.01em;
    }

    .brand-subtitle em {
      font-style: italic;
      font-weight: 700;
      color: var(--btn-plus);
    }

    /* Area Tampilan Angka Utama */
    .counter-stage {
      position: relative;
      background: linear-gradient(145deg, #FFF3F7 0%, #FFF9EC 52%, #F5F1FF 100%);
      border: 1.5px solid var(--card-border);
      border-radius: 22px;
      padding: 18px 14px 16px;
      text-align: center;
      margin-bottom: 14px;
      overflow: hidden;
    }

    .milestone-banner {
      display: inline-block;
      min-height: 22px;
      padding: 3px 12px;
      border-radius: 999px;
      font-size: 0.74rem;
      font-weight: 700;
      margin-bottom: 2px;
      opacity: 0;
      transform: translateY(5px) scale(0.9);
      transition: all 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .milestone-banner.show {
      opacity: 1;
      transform: translateY(0) scale(1);
    }

    .milestone-banner.half {
      background: rgba(242, 163, 65, 0.22);
      color: var(--text-primary);
      border: 1px solid rgba(242, 163, 65, 0.55);
    }

    .milestone-banner.full {
      background: linear-gradient(90deg, rgba(242, 100, 141, 0.22), rgba(154, 114, 207, 0.22));
      color: var(--text-primary);
      border: 1px solid var(--btn-plus);
    }

    /* Angka Fredoka Bergradasi Bunga Taman (Compact di desktop: 3.75rem) */
    .counter-value {
      font-family: 'Fredoka', cursive, sans-serif;
      font-size: 3.75rem;
      font-weight: 700;
      line-height: 1.05;
      background: linear-gradient(135deg, var(--num-start) 0%, var(--num-mid) 52%, var(--num-end) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 5px 10px var(--num-shadow));
      user-select: none;
      display: inline-block;
      will-change: transform;
      font-variant-numeric: tabular-nums;
    }

    /* Keyframes Animasi Ceria */
    @keyframes cheerUp {
      0%   { transform: scale(0.82) translateY(14px) rotate(-6deg); }
      45%  { transform: scale(1.22) translateY(-10px) rotate(5deg); }
      72%  { transform: scale(0.94) translateY(3px) rotate(-2deg); }
      100% { transform: scale(1) translateY(0) rotate(0deg); }
    }

    @keyframes cheerDown {
      0%   { transform: scale(1.14) translateY(-10px) rotate(5deg); }
      45%  { transform: scale(0.84) translateY(10px) rotate(-5deg); }
      75%  { transform: scale(1.05) translateY(-2px) rotate(2deg); }
      100% { transform: scale(1) translateY(0) rotate(0deg); }
    }

    @keyframes resetWiggle {
      0%   { transform: scale(1) rotate(0deg); }
      25%  { transform: scale(0.85) rotate(-10deg); }
      55%  { transform: scale(1.12) rotate(8deg); }
      80%  { transform: scale(0.96) rotate(-3deg); }
      100% { transform: scale(1) rotate(0deg); }
    }

    @keyframes halfPulse {
      0%   { transform: scale(1); }
      30%  { transform: scale(1.26) rotate(-4deg); }
      60%  { transform: scale(1.12) rotate(4deg); }
      100% { transform: scale(1) rotate(0deg); }
    }

    @keyframes grandCelebrate {
      0%   { transform: scale(0.85) rotate(0deg); }
      25%  { transform: scale(1.32) rotate(-8deg); }
      50%  { transform: scale(1.22) rotate(8deg); }
      75%  { transform: scale(1.28) rotate(-4deg); }
      100% { transform: scale(1) rotate(0deg); }
    }

    .anim-up { animation: cheerUp 0.44s cubic-bezier(0.34, 1.56, 0.64, 1); }
    .anim-down { animation: cheerDown 0.42s cubic-bezier(0.34, 1.56, 0.64, 1); }
    .anim-reset { animation: resetWiggle 0.45s ease; }
    .anim-half { animation: halfPulse 0.65s cubic-bezier(0.34, 1.56, 0.64, 1); }
    .anim-full { animation: grandCelebrate 0.85s cubic-bezier(0.34, 1.56, 0.64, 1); }

    /* Gelembung Angka Melayang (+1 / -1 / +5 / -5 / +10 / -10) */
    .delta-pop {
      position: absolute;
      font-family: 'Fredoka', sans-serif;
      font-weight: 700;
      font-size: 1.25rem;
      pointer-events: none;
      animation: floatDelta 0.7s ease-out forwards;
    }

    @keyframes floatDelta {
      0%   { opacity: 1; transform: translate(-50%, 0) scale(0.7); }
      40%  { opacity: 1; transform: translate(-50%, -24px) scale(1.15); }
      100% { opacity: 0; transform: translate(-50%, -46px) scale(0.95); }
    }

    /* Layer Partikel Bunga Terbang */
    .fx-layer {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 50;
      overflow: hidden;
    }

    .confetti-piece {
      position: absolute;
      user-select: none;
      pointer-events: none;
      will-change: transform, opacity;
      animation: flowerBurst var(--dur, 1.4s) cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    @keyframes flowerBurst {
      0% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(0.4) rotate(0deg);
      }
      65% {
        opacity: 1;
      }
      100% {
        opacity: 0;
        transform: translate(calc(-50% + var(--tx)), calc(-50% + var(--ty))) scale(1.15) rotate(var(--rot));
      }
    }

    /* Progress Bar Target */
    .target-box {
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1px dashed var(--card-border);
    }

    .target-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.76rem;
      font-weight: 700;
      color: var(--text-secondary);
      margin-bottom: 6px;
    }

    .progress-track {
      width: 100%;
      height: 10px;
      background: var(--progress-bg);
      border-radius: 999px;
      overflow: hidden;
      position: relative;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      border-radius: 999px;
      background: linear-gradient(90deg, #FF759F, #FFB703, #8E54E9);
      transition: width 0.38s cubic-bezier(0.34, 1.56, 0.64, 1), background 0.35s ease;
    }

    .progress-fill.half-reached {
      background: linear-gradient(90deg, #F2A341, #FFD166, #FF759F);
      box-shadow: 0 0 12px rgba(242, 163, 65, 0.55);
    }

    .progress-fill.full-reached {
      background: linear-gradient(90deg, #5EA683, #80ED99, #FFD166);
      box-shadow: 0 0 14px rgba(94, 166, 131, 0.65);
    }

    /* Tombol Kontrol Utama (+ dan -) */
    .main-controls {
      display: grid;
      grid-template-columns: 1fr 1.45fr;
      gap: 10px;
      margin-bottom: 12px;
    }

    .btn-action {
      border: none;
      border-radius: 17px;
      padding: 13px;
      font-family: 'Fredoka', sans-serif;
      font-size: 1.65rem;
      font-weight: 700;
      color: #FFFDFB;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      box-shadow: 0 6px 15px -5px rgba(87, 39, 66, 0.25);
      transition: transform 0.16s cubic-bezier(0.34, 1.56, 0.64, 1), background-color 0.2s ease, box-shadow 0.2s ease;
    }

    .btn-action:hover {
      transform: translateY(-2px);
    }

    .btn-action:active {
      transform: scale(0.93);
    }

    .btn-minus {
      background: var(--btn-minus);
    }
    .btn-minus:hover {
      background: var(--btn-minus-hover);
    }

    .btn-plus {
      background: linear-gradient(135deg, #FF6B98, #F2648D);
    }
    .btn-plus:hover {
      background: linear-gradient(135deg, #F55887, #E04E78);
    }

    /* Kartu Pengaturan Langkah & Target */
    .settings-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 12px;
    }

    .setting-card {
      background: rgba(255, 242, 246, 0.85);
      border: 1.5px solid var(--card-border);
      border-radius: 16px;
      padding: 10px;
    }

    .setting-label {
      display: block;
      font-size: 0.71rem;
      font-weight: 700;
      color: var(--text-secondary);
      margin-bottom: 6px;
    }

    .step-pills {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 5px;
    }

    .step-pill {
      border: 1.5px solid var(--card-border);
      background: var(--card-bg);
      color: var(--text-primary);
      border-radius: 9px;
      padding: 6px 0;
      font-family: 'Fredoka', sans-serif;
      font-size: 0.84rem;
      font-weight: 700;
      cursor: pointer;
      user-select: none;
      transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .step-pill:hover {
      transform: translateY(-1px);
    }

    .step-pill:active {
      transform: scale(0.95);
    }

    .step-pill.active {
      background: var(--btn-step-active);
      border-color: var(--btn-step-active);
      color: #FFFDFB;
      box-shadow: 0 3px 8px -2px rgba(242, 163, 65, 0.45);
      transform: translateY(-1px);
    }

    .input-mini {
      width: 100%;
      border: 1.5px solid var(--card-border);
      background: var(--card-bg);
      color: var(--text-primary);
      border-radius: 9px;
      padding: 6px 9px;
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 0.82rem;
      font-weight: 700;
      outline: none;
    }

    .input-mini:focus {
      border-color: var(--btn-plus);
    }

    /* Footer & Tombol Reset */
    .footer-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .shortcut-hint {
      font-size: 0.69rem;
      color: var(--text-secondary);
      font-weight: 600;
    }

    .btn-reset {
      border: none;
      background: var(--btn-reset);
      color: #FFFDFB;
      padding: 8px 14px;
      border-radius: 12px;
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 0.78rem;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      transition: transform 0.16s ease, background-color 0.2s ease;
    }

    .btn-reset:hover {
      background: var(--btn-reset-hover);
      transform: translateY(-1.5px);
    }

    .btn-reset:active {
      transform: scale(0.94);
    }

    /* Penyesuaian Responsif Khusus Layar HP (<= 480px) */
    @media (max-width: 480px) {
      body {
        padding: 14px;
      }

      .card {
        max-width: 100%;
        padding: 20px 18px;
        border-radius: 26px;
      }

      .icon-btn {
        width: 36px;
        height: 36px;
      }

      .counter-value {
        font-size: clamp(3.6rem, 16vw, 4.35rem);
      }

      .btn-action {
        padding: 15px;
        font-size: 1.85rem;
      }

      .step-pill {
        padding: 8px 0;
        font-size: 0.88rem;
      }

      .input-mini {
        padding: 8px 10px;
        font-size: 0.86rem;
      }

      .btn-reset {
        padding: 9px 16px;
        font-size: 0.82rem;
      }

      .shortcut-hint {
        display: none;
      }

      .footer-bar {
        justify-content: flex-end;
      }

      .bg-blossom {
        opacity: 0.28;
      }
    }

    /* Efek Pendaran Kartu saat Selebrasi */
    @keyframes cardHalfGlow {
      0%   { box-shadow: var(--shadow-card); }
      40%  { box-shadow: 0 0 0 8px rgba(242, 163, 65, 0.35), var(--shadow-card); }
      100% { box-shadow: var(--shadow-card); }
    }

    @keyframes cardFullParty {
      0%   { transform: scale(1); box-shadow: var(--shadow-card); }
      25%  { transform: scale(1.025); box-shadow: 0 0 0 12px rgba(255, 209, 102, 0.45), var(--shadow-card); }
      55%  { transform: scale(0.99); box-shadow: 0 0 0 18px var(--accent-glow), var(--shadow-card); }
      100% { transform: scale(1); box-shadow: var(--shadow-card); }
    }

    .card.celebrate-half { animation: cardHalfGlow 0.9s ease; }
    .card.celebrate-full { animation: cardFullParty 1.1s cubic-bezier(0.34, 1.56, 0.64, 1); }

    /* Modal Konfirmasi Reset */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(54, 24, 41, 0.52);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 100;
    }

    .modal-backdrop.open {
      display: flex;
    }

    .modal-box {
      width: 100%;
      max-width: 340px;
      background: var(--card-bg);
      border: 2px solid var(--card-border);
      border-radius: 26px;
      padding: 24px;
      text-align: center;
