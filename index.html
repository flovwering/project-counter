<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Counter Project</title>
  <!-- Ikon Tab Browser (Favicon) -->
  <link rel="icon" type="image/png" href="rajuthif.png" />
  <link rel="apple-touch-icon" href="rajuthif.png" />
  <!-- Google Fonts: Fredoka (Angka Playful) & Plus Jakarta Sans (Teks Utama) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Plus+Jakarta+Sans:wght@500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-main: #C4D8E5;
      --gingham-stripe: rgba(142, 177, 209, 0.32);
      --card-bg: #E8ECEF;
      --card-border: #A7C7E7;
      --line-soft: #A7C7E7;
      --text-primary: #1C2B48;
      --text-secondary: #1C2B48;
      --on-dark: #E8ECEF;
      --stage-bg: #C4D8E5;
      --box-soft: #C4D8E5;
      --num-color: #1C2B48;
      --num-shadow: rgba(28, 43, 72, 0.22);
      --btn-plus: #1C2B48;
      --btn-plus-hover: #2B3F66;
      --btn-plus-border: #131E35;
      --btn-minus: #C4D8E5;
      --btn-minus-hover: #A7C7E7;
      --btn-step-active: #1C2B48;
      --btn-step-shadow: rgba(28, 43, 72, 0.34);
      --btn-shadow-soft: rgba(28, 43, 72, 0.28);
      --btn-reset: #8EB1D1;
      --btn-reset-hover: #7BA0C3;
      --btn-tea-bg: #1C2B48;
      --btn-tea-hover: #2B3F66;
      --btn-tea-shadow: rgba(28, 43, 72, 0.30);
      --surface-soft: #C4D8E5;
      --progress-bg: #E8ECEF;
      --progress-fill: #A7C7E7;
      --progress-half: #8EB1D1;
      --progress-full: #1C2B48;
      --accent-glow: rgba(142, 177, 209, 0.50);
      --dot-ring: rgba(28, 43, 72, 0.40);
      --backdrop: rgba(28, 43, 72, 0.45);
      --delta-up: #1C2B48;
      --delta-down: #8EB1D1;
      --shadow-card: 0 24px 50px -12px rgba(28, 43, 72, 0.30), 0 10px 24px -8px rgba(142, 177, 209, 0.42);
    }

    :root[data-theme="pink"] {
      --bg-main: #F3D9DA;
      --gingham-stripe: rgba(216, 154, 160, 0.30);
      --card-bg: #FBF4F2;
      --card-border: #D89AA0;
      --line-soft: #D89AA0;
      --text-primary: #7A3B41;
      --text-secondary: #7A3B41;
      --on-dark: #FBF4F2;
      --stage-bg: #F3D9DA;
      --box-soft: #F3D9DA;
      --num-color: #7A3B41;
      --num-shadow: rgba(122, 59, 65, 0.20);
      --btn-plus: #7A3B41;
      --btn-plus-hover: #693238;
      --btn-plus-border: #5A2A30;
      --btn-minus: #F3D9DA;
      --btn-minus-hover: #D89AA0;
      --btn-step-active: #7A3B41;
      --btn-step-shadow: rgba(122, 59, 65, 0.36);
      --btn-shadow-soft: rgba(122, 59, 65, 0.24);
      --btn-reset: #D89AA0;
      --btn-reset-hover: #C98890;
      --btn-tea-bg: #7A3B41;
      --btn-tea-hover: #693238;
      --btn-tea-shadow: rgba(122, 59, 65, 0.30);
      --surface-soft: #F3D9DA;
      --progress-bg: #FBF4F2;
      --progress-fill: #D89AA0;
      --progress-half: #A96B71;
      --progress-full: #7A3B41;
      --accent-glow: rgba(216, 154, 160, 0.55);
      --dot-ring: rgba(216, 154, 160, 0.55);
      --backdrop: rgba(122, 59, 65, 0.40);
      --delta-up: #7A3B41;
      --delta-down: #D89AA0;
      --shadow-card: 0 24px 50px -12px rgba(122, 59, 65, 0.28), 0 10px 24px -8px rgba(216, 154, 160, 0.40);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: var(--bg-main);
      color: var(--text-primary);
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      overflow-x: hidden;
      position: relative;
    }

    body::before {
      content: '';
      position: fixed;
      inset: -24px;
      z-index: 0;
      pointer-events: none;
      background-image:
        repeating-linear-gradient(
          0deg,
          var(--gingham-stripe) 0px,
          var(--gingham-stripe) 28px,
          transparent 28px,
          transparent 56px
        ),
        repeating-linear-gradient(
          90deg,
          var(--gingham-stripe) 0px,
          var(--gingham-stripe) 28px,
          transparent 28px,
          transparent 56px
        );
      filter: blur(1px);
    }

    /* KARTU DIBUAT LEBIH BESAR (max-width diperluas dan padding ditambah) */
    .card {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 420px;
      background-color: var(--card-bg);
      border: 2px solid var(--card-border);
      border-radius: 32px;
      padding: 26px 24px 22px;
      box-shadow: var(--shadow-card);
      overflow: hidden;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .content {
      position: relative;
      z-index: 1;
    }

    /* Header */
    .header {
      margin-bottom: 14px;
    }

    .header-top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 12px;
    }

    .badge-save {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background-color: var(--box-soft);
      border: 1px solid var(--line-soft);
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 0.73rem;
      font-weight: 700;
      color: var(--text-secondary);
      white-space: nowrap;
    }

    .dot-live {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: var(--text-primary);
      box-shadow: 0 0 0 2.5px var(--dot-ring);
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .icon-btn {
      width: 38px;
      height: 38px;
      border-radius: 13px;
      border: 1.5px solid var(--line-soft);
      background-color: var(--box-soft);
      color: var(--text-primary);
      cursor: pointer;
      display: grid;
      place-items: center;
      font-size: 1rem;
      transition: transform 0.18s ease, background-color 0.2s ease, border-color 0.2s ease;
    }

    .icon-btn:hover {
      background-color: var(--btn-minus-hover);
      transform: translateY(-1.5px);
    }

    .icon-btn:active {
      transform: scale(0.92);
    }

    .title-area {
      text-align: center;
      padding: 2px 4px;
    }

    .title-edit-wrapper {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      max-width: 100%;
      background-color: var(--surface-soft);
      border: 1.5px dashed transparent;
      border-radius: 14px;
      padding: 4px 12px;
      transition: border-color 0.2s ease, background-color 0.2s ease;
    }

    .title-edit-wrapper:hover,
    .title-edit-wrapper:focus-within {
      border-color: var(--card-border);
      background-color: var(--card-bg);
    }

    .counter-title-input {
      font-family: 'Fredoka', sans-serif;
      font-size: 1.22rem;
      font-weight: 700;
      color: var(--text-primary);
      background-color: transparent;
      border: none;
      outline: none;
      text-align: center;
      width: 220px;
      max-width: 68vw;
      text-overflow: ellipsis;
    }

    .edit-pencil-btn {
      border: none;
      background-color: transparent;
      color: var(--text-primary);
      font-size: 0.9rem;
      cursor: pointer;
      padding: 2px;
      line-height: 1;
      opacity: 0.8;
      transition: opacity 0.2s ease, transform 0.2s ease;
    }

    .edit-pencil-btn:hover {
      opacity: 1;
      transform: scale(1.12);
    }

    /* Area Tampilan Angka Utama */
    .counter-stage {
      position: relative;
      background-color: var(--stage-bg);
      border: 1.5px solid var(--card-border);
      border-radius: 24px;
      padding: 24px 16px 18px;
      text-align: center;
      margin-bottom: 16px;
      overflow: hidden;
    }

    .milestone-banner {
      display: inline-block;
      min-height: 24px;
      padding: 4px 14px;
      border-radius: 999px;
      font-size: 0.78rem;
      font-weight: 700;
      margin-bottom: 4px;
      opacity: 0;
      transform: translateY(5px) scale(0.9);
      transition: all 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .milestone-banner.show {
      opacity: 1;
      transform: translateY(0) scale(1);
    }

    .milestone-banner.half {
      background-color: var(--card-bg);
      color: var(--text-primary);
      border: 1px solid var(--card-border);
    }

    .milestone-banner.full {
      background-color: var(--text-primary);
      color: var(--on-dark);
      border: 1px solid var(--text-primary);
    }

    .counter-value {
      font-family: 'Fredoka', cursive, sans-serif;
      font-size: 5.6rem;
      font-weight: 700;
      line-height: 1.05;
      color: var(--num-color);
      filter: drop-shadow(0 4px 8px var(--num-shadow));
      user-select: none;
      display: inline-block;
      will-change: transform;
      font-variant-numeric: tabular-nums;
    }

    @keyframes cheerUp {
      0%   { transform: scale(0.82) translateY(14px) rotate(-6deg); }
      45%  { transform: scale(1.22) translateY(-10px) rotate(5deg); }
      72%  { transform: scale(0.94) translateY(3px) rotate(-2deg); }
      100% { transform: scale(1) translateY(0) rotate(0deg); }
    }

    @keyframes cheerDown {
      0%   { transform: scale(1.14) translateY(-10px) rotate(5deg); }
      45%  { transform: scale(0.84) translateY(10px) rotate(-5deg); }
      75%  { transform: scale(1.05) translateY(-2px) rotate(2deg); }
      100% { transform: scale(1) translateY(0) rotate(0deg); }
    }

    @keyframes resetWiggle {
      0%   { transform: scale(1) rotate(0deg); }
      25%  { transform: scale(0.85) rotate(-10deg); }
      55%  { transform: scale(1.12) rotate(8deg); }
      80%  { transform: scale(0.96) rotate(-3deg); }
      100% { transform: scale(1) rotate(0deg); }
    }

    @keyframes halfPulse {
      0%   { transform: scale(1); }
      30%  { transform: scale(1.26) rotate(-4deg); }
      60%  { transform: scale(1.12) rotate(4deg); }
      100% { transform: scale(1) rotate(0deg); }
    }

    @keyframes grandCelebrate {
      0%   { transform: scale(0.85) rotate(0deg); }
      25%  { transform: scale(1.32) rotate(-8deg); }
      50%  { transform: scale(1.22) rotate(8deg); }
      75%  { transform: scale(1.28) rotate(-4deg); }
      100% { transform: scale(1) rotate(0deg); }
    }

    .anim-up { animation: cheerUp 0.44s cubic-bezier(0.34, 1.56, 0.64, 1); }
    .anim-down { animation: cheerDown 0.42s cubic-bezier(0.34, 1.56, 0.64, 1); }
    .anim-reset { animation: resetWiggle 0.45s ease; }
    .anim-half { animation: halfPulse 0.65s cubic-bezier(0.34, 1.56, 0.64, 1); }
    .anim-full { animation: grandCelebrate 0.85s cubic-bezier(0.34, 1.56, 0.64, 1); }

    .delta-pop {
      position: absolute;
      font-family: 'Fredoka', sans-serif;
      font-weight: 700;
      font-size: 1.3rem;
      pointer-events: none;
      animation: floatDelta 0.7s ease-out forwards;
    }

    @keyframes floatDelta {
      0%   { opacity: 1; transform: translate(-50%, 0) scale(0.7); }
      40%  { opacity: 1; transform: translate(-50%, -24px) scale(1.15); }
      100% { opacity: 0; transform: translate(-50%, -46px) scale(0.95); }
    }

    .fx-layer {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 50;
      overflow: hidden;
    }

    .confetti-piece {
      position: absolute;
      user-select: none;
      pointer-events: none;
      font-weight: 700;
      line-height: 1;
      white-space: nowrap;
      will-change: transform, opacity;
      animation: sparkleBurst var(--dur, 1.4s) cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    @keyframes sparkleBurst {
      0% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(0.4) rotate(0deg);
      }
      65% {
        opacity: 1;
      }
      100% {
        opacity: 0;
        transform: translate(calc(-50% + var(--tx)), calc(-50% + var(--ty))) scale(1.15) rotate(var(--rot));
      }
    }

    /* Target Box & Progress Bar dengan Efek Berjalan (Shimmer/Striped Animation) */
    .target-box {
      margin-top: 14px;
      padding-top: 12px;
      border-top: 1px dashed var(--line-soft);
    }

    .target-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 8px;
    }

    .progress-track {
      width: 100%;
      height: 12px;
      background-color: var(--progress-bg);
      border: 1px solid var(--card-border);
      border-radius: 999px;
      overflow: hidden;
      position: relative;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      border-radius: 999px;
      background-color: var(--progress-fill);
      position: relative;
      transition: width 0.38s cubic-bezier(0.34, 1.56, 0.64, 1), background-color 0.25s ease;
      overflow: hidden;
    }

    /* Efek garis berjalan / bergerak saat diam (shimmer effect tanpa gambar) */
    .progress-fill::after {
      content: '';
      position: absolute;
      inset: 0;
      background-image: linear-gradient(
        90deg,
        rgba(255, 255, 255, 0) 0%,
        rgba(255, 255, 255, 0.45) 50%,
        rgba(255, 255, 255, 0) 100%
      );
      background-size: 200px 100%;
      animation: progressShimmer 2s linear infinite;
    }

    @keyframes progressShimmer {
      0%   { background-position: -200px 0; }
      100% { background-position: 200px 0; }
    }

    .progress-fill.half-reached {
      background-color: var(--progress-half);
      box-shadow: 0 0 10px var(--accent-glow);
    }

    .progress-fill.full-reached {
      background-color: var(--progress-full);
      box-shadow: 0 0 12px var(--accent-glow);
    }

    /* Tombol Kontrol Utama */
    .main-controls {
      display: grid;
      grid-template-columns: 1fr 1.45fr;
      gap: 12px;
      margin-bottom: 14px;
    }

    .btn-action {
      border-radius: 18px;
      padding: 15px;
      font-family: 'Fredoka', sans-serif;
      font-size: 1.8rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      box-shadow: 0 6px 15px -5px var(--btn-shadow-soft);
      transition: transform 0.16s cubic-bezier(0.34, 1.56, 0.64, 1), background-color 0.2s ease, box-shadow 0.2s ease;
    }

    .btn-action:hover {
      transform: translateY(-2px);
    }

    .btn-action:active {
      transform: scale(0.93);
    }

    .btn-minus {
      background-color: var(--btn-minus);
      border: 1.5px solid var(--line-soft);
      color: var(--text-primary);
    }
    .btn-minus:hover {
      background-color: var(--btn-minus-hover);
    }

    .btn-plus {
      background-color: var(--btn-plus);
      border: 1.5px solid var(--btn-plus-border);
      color: var(--on-dark);
    }
    .btn-plus:hover {
      background-color: var(--btn-plus-hover);
    }

    /* Kartu Pengaturan Langkah & Target */
    .settings-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 14px;
    }

    .setting-card {
      background-color: var(--surface-soft);
      border: 1.5px solid var(--card-border);
      border-radius: 18px;
      padding: 12px;
    }

    .setting-label {
      display: block;
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 8px;
    }

    .step-pills {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
    }

    .step-pill {
      border: 1.5px solid var(--card-border);
      background-color: var(--card-bg);
      color: var(--text-primary);
      border-radius: 10px;
      padding: 8px 0;
      font-family: 'Fredoka', sans-serif;
      font-size: 0.88rem;
      font-weight: 700;
      cursor: pointer;
      user-select: none;
      transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .step-pill:hover {
      transform: translateY(-1px);
    }

    .step-pill:active {
      transform: scale(0.95);
    }

    .step-pill.active {
      background-color: var(--btn-step-active);
      border-color: var(--btn-plus-border);
      color: var(--on-dark);
      box-shadow: 0 3px 8px -2px var(--btn-step-shadow);
      transform: translateY(-1px);
    }

    .input-mini {
      width: 100%;
      border: 1.5px solid var(--card-border);
      background-color: var(--card-bg);
      color: var(--text-primary);
      border-radius: 10px;
      padding: 8px 10px;
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 0.86rem;
      font-weight: 700;
      outline: none;
    }

    .input-mini:focus {
      border-color: var(--text-primary);
    }

    /* Footer & Tombol Reset + Kritik & Saran + Traktir Es Teh */
    .footer-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
    }

    .shortcut-hint {
      font-size: 0.72rem;
      color: var(--text-secondary);
      font-weight: 600;
    }

    .footer-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-left: auto;
    }

    .btn-reset,
    .btn-feedback,
    .btn-es-teh {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      height: 42px;
      padding: 0 14px;
      border-radius: 14px;
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 0.86rem;
      font-weight: 700;
      white-space: nowrap;
      cursor: pointer;
    }

    .btn-reset {
      border: none;
      background-color: var(--btn-reset);
      color: var(--text-primary);
      transition: transform 0.16s ease, background-color 0.2s ease;
    }

    .btn-reset:hover {
      background-color: var(--btn-reset-hover);
      transform: translateY(-1.5px);
    }

    .btn-reset:active {
      transform: scale(0.94);
    }

    .btn-feedback,
    .btn-es-teh {
      width: auto;
      border: none;
      background-color: var(--btn-tea-bg);
      color: var(--on-dark);
      text-decoration: none;
      box-shadow: 0 6px 14px -4px var(--btn-tea-shadow);
      transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1), background-color 0.2s ease, box-shadow 0.2s ease;
    }

    .btn-feedback:hover,
    .btn-es-teh:hover {
      background-color: var(--btn-tea-hover);
      transform: translateY(-2px);
    }

    .btn-feedback:active,
    .btn-es-teh:active {
      transform: scale(0.95);
    }

    @media (max-width: 520px) {
      body {
        padding: 14px;
      }

      .card {
        max-width: 100%;
        padding: 24px 18px;
        border-radius: 26px;
      }

      .shortcut-hint {
        display: none;
      }

      .footer-actions {
        width: 100%;
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 6px;
      }

      .btn-reset,
      .btn-feedback,
      .btn-es-teh {
        width: 100%;
        height: 44px;
        font-size: 0.76rem;
        padding: 0 4px;
      }
    }

    @keyframes cardHalfGlow {
      0%   { box-shadow: var(--shadow-card); }
      40%  { box-shadow: 0 0 0 8px var(--accent-glow), var(--shadow-card); }
      100% { box-shadow: var(--shadow-card); }
    }

    @keyframes cardFullParty {
      0%   { transform: scale(1); box-shadow: var(--shadow-card); }
      25%  { transform: scale(1.025); box-shadow: 0 0 0 12px var(--accent-glow), var(--shadow-card); }
      55%  { transform: scale(0.99); box-shadow: 0 0 0 18px var(--accent-glow), var(--shadow-card); }
      100% { transform: scale(1); box-shadow: var(--shadow-card); }
    }

    .card.celebrate-half { animation: cardHalfGlow 0.9s ease; }
    .card.celebrate-full { animation: cardFullParty 1.1s cubic-bezier(0.34, 1.56, 0.64, 1); }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      background-color: var(--backdrop);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 100;
    }

    .modal-backdrop.open {
      display: flex;
    }

    .modal-box {
      width: 100%;
      max-width: 340px;
      background-color: var(--card-bg);
      border: 2px solid var(--card-border);
      border-radius: 26px;
      padding: 24px;
      text-align: center;
      box-shadow: var(--shadow-card);
      animation: cheerUp 0.32s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .modal-title {
      font-family: 'Fredoka', sans-serif;
      font-size: 1.35rem;
      margin-bottom: 8px;
    }

    .modal-desc {
      font-size: 0.88rem;
      color: var(--text-secondary);
      margin-bottom: 20px;
      line-height: 1.45;
    }

    .modal-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .btn-modal {
      padding: 11px;
      border-radius: 14px;
      font-weight: 700;
      font-size: 0.88rem;
      cursor: pointer;
      border: 1.5px solid var(--card-border);
      transition: transform 0.15s ease;
    }

    .btn-modal:active {
      transform: scale(0.95);
    }

    .btn-cancel {
      background-color: var(--surface-soft);
      color: var(--text-primary);
    }

    .btn-confirm-reset {
      background-color: var(--btn-plus);
      border-color: var(--btn-plus-border);
      color: var(--on-dark);
    }
  </style>
</head>
<body>
  <!-- Layer Partikel Perayaan -->
  <div class="fx-layer" id="fxLayer"></div>

  <main class="card" id="mainCard">
    <div class="content">
      <!-- Header -->
      <header class="header">
        <div class="header-top-bar">
          <div class="badge-save">
            <span class="dot-live"></span>
            <span>Tersimpan Otomatis</span>
          </div>
          <div class="top-actions">
            <button type="button" class="icon-btn" id="themeToggle" title="Ganti ke tema Pink" aria-label="Ganti tema warna">🌸</button>
            <button type="button" class="icon-btn" id="soundToggle" title="Suara Aktif/Nonaktif" aria-label="Suara">🔊</button>
          </div>
        </div>

        <div class="title-area">
          <div class="title-edit-wrapper">
            <input
              type="text"
              id="counterTitleInput"
              class="counter-title-input"
              value="My Project Counter"
              maxlength="36"
              aria-label="Nama Counter"
              title="Klik untuk mengganti nama counter"
            />
            <button type="button" class="edit-pencil-btn" id="editTitleBtn" title="Ubah Nama Counter" aria-label="Edit Nama">✏️</button>
          </div>
        </div>
      </header>

      <!-- Display Angka & Target -->
      <section class="counter-stage" id="counterStage">
        <div class="milestone-banner" id="milestoneBanner">✨ Setengah Jalan (50%)!</div>
        <div>
          <span class="counter-value" id="counterDisplay">0</span>
        </div>

        <div class="target-box" id="targetBox">
          <div class="target-header">
            <span id="targetStatusText">Target: 50</span>
            <span id="targetPercentText">0%</span>
          </div>
          <div class="progress-track">
            <div class="progress-fill" id="progressFill"></div>
          </div>
        </div>
      </section>

      <!-- Tombol Utama Kurang (-) & Tambah (+) -->
      <section class="main-controls">
        <button type="button" class="btn-action btn-minus" id="btnMinus" aria-label="Kurangi Hitungan">−</button>
        <button type="button" class="btn-action btn-plus" id="btnPlus" aria-label="Tambah Hitungan">+</button>
      </section>

      <!-- Pengaturan Langkah (+1, +5, +10) & Target Hitungan -->
      <section class="settings-grid">
        <div class="setting-card">
          <span class="setting-label">Langkah Hitungan</span>
          <div class="step-pills" id="stepPills" role="group" aria-label="Pilih Langkah Hitungan">
            <button type="button" class="step-pill active" data-step="1">+1</button>
            <button type="button" class="step-pill" data-step="5">+5</button>
            <button type="button" class="step-pill" data-step="10">+10</button>
          </div>
        </div>

        <div class="setting-card">
          <label class="setting-label" for="targetInput">Target Hitungan</label>
          <input class="input-mini" type="number" id="targetInput" min="1" placeholder="Contoh: 50" />
        </div>
      </section>

      <!-- Footer Pintasan, Tombol Reset, Kritik & Saran, & Traktir Es Teh -->
      <footer class="footer-bar">
        <span class="shortcut-hint">Spasi / ↑ : + &nbsp;|&nbsp; ↓ : − &nbsp;|&nbsp; R : Reset</span>
        <div class="footer-actions">
          <button type="button" class="btn-reset" id="btnReset">↺ Reset</button>
          <a href="https://forms.gle/eqAKjefinKbaFiTF9" target="_blank" rel="noopener noreferrer" class="btn-feedback">
            <span>💬</span>
            <span>Kritik & Saran</span>
          </a>
          <a href="https://teer.id/flovwering" target="_blank" rel="noopener noreferrer" class="btn-es-teh">
            <span class="tea-icon">🍹</span>
            <span>Traktir Es Teh</span>
          </a>
        </div>
      </footer>
    </div>
  </main>

  <!-- Modal Konfirmasi Reset -->
  <div class="modal-backdrop" id="resetModal">
    <div class="modal-box">
      <h2 class="modal-title">Reset Hitungan?</h2>
      <p class="modal-desc">Angka hitungan saat ini akan dikembalikan ke <strong>0</strong>. Apakah Anda yakin ingin melanjutkan?</p>
      <div class="modal-actions">
        <button type="button" class="btn-modal btn-cancel" id="cancelReset">Batal</button>
        <button type="button" class="btn-modal btn-confirm-reset" id="confirmReset">Ya, Reset</button>
      </div>
    </div>
  </div>

  <script>
    const STORAGE_KEY = 'aesthetic_cheerful_counter_v15';
    const ALLOWED_STEPS = [1, 5, 10];

    let state = {
      title: 'My Project Counter',
      count: 0,
      step: 1,
      target: 50,
      sound: true,
      theme: 'blue'
    };

    try {
      const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
      if (saved && typeof saved === 'object') {
        state = { ...state, ...saved };
      }
    } catch (e) {
      console.error('Gagal membaca penyimpanan lokal:', e);
    }

    state.count = Number.isFinite(Number(state.count)) ? Math.max(0, Number(state.count)) : 0;
    state.step = ALLOWED_STEPS.includes(Number(state.step)) ? Number(state.step) : 1;
    state.target = Number.isFinite(Number(state.target)) && Number(state.target) > 0 ? Number(state.target) : 50;

    const THEMES = ['blue', 'pink'];
    if (!THEMES.includes(state.theme)) state.theme = 'blue';
    document.documentElement.dataset.theme = state.theme;

    const mainCard = document.getElementById('mainCard');
    const counterTitleInput = document.getElementById('counterTitleInput');
    const editTitleBtn = document.getElementById('editTitleBtn');
    const counterStage = document.getElementById('counterStage');
    const counterDisplay = document.getElementById('counterDisplay');
    const milestoneBanner = document.getElementById('milestoneBanner');
    const targetStatusText = document.getElementById('targetStatusText');
    const targetPercentText = document.getElementById('targetPercentText');
    const progressFill = document.getElementById('progressFill');
    const targetInput = document.getElementById('targetInput');
    const stepPillsContainer = document.getElementById('stepPills');
    const stepPills = document.querySelectorAll('.step-pill');
    const btnPlus = document.getElementById('btnPlus');
    const btnMinus = document.getElementById('btnMinus');
    const btnReset = document.getElementById('btnReset');
    const soundToggle = document.getElementById('soundToggle');
    const themeToggle = document.getElementById('themeToggle');
    const resetModal = document.getElementById('resetModal');
    const cancelReset = document.getElementById('cancelReset');
    const confirmReset = document.getElementById('confirmReset');
    const fxLayer = document.getElementById('fxLayer');

    const PARTICLE_CONFIG = {
      step: ['⋆', '˙', '⟡', '˚', '⊹', '₊', '⋆˙⟡', '⋆.˚', '⊹₊⟡'],
      half: ['⋆', '⟡', '⊹', '✦', '✧', '⋆˙⟡', '⋆.˚', '⊹₊⟡', '₊˚⊹', '♡'],
      full: ['⋆', '⟡', '⊹', '✦', '✧', '❋', '✿', '♡', '⋆˙⟡', '⋆.˚', '⊹₊⟡', '₊˚⊹', '⋆⁺₊⋆', '˚₊‧'],
      colors: ['#E58F9B', '#EDB26B', '#8FBF98', '#79AEDB', '#A996D6', '#E39A74', '#7CBFB8', '#D68FB8']
    };

    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      } catch (e) {
        console.error('Gagal menyimpan ke penyimpanan lokal:', e);
      }
    }

    let audioCtx = null;
    function getAudioCtx() {
      if (!audioCtx) {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        audioCtx = new AudioContext();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      return audioCtx;
    }

    function playTone(freq, type, startTime, duration, volume = 0.16, slideTo = null) {
      if (!state.sound) return;
      const ctx = getAudioCtx();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();

      osc.type = type;
      osc.frequency.setValueAtTime(freq, startTime);
      if (slideTo) {
        osc.frequency.exponentialRampToValueAtTime(slideTo, startTime + duration);
      }

      gain.gain.setValueAtTime(0.001, startTime);
      gain.gain.linearRampToValueAtTime(volume, startTime + 0.015);
      gain.gain.exponentialRampToValueAtTime(0.001, startTime + duration);

      osc.connect(gain);
      gain.connect(ctx.destination);

      osc.start(startTime);
      osc.stop(startTime + duration + 0.02);
    }

    function soundPlus() {
      if (!state.sound) return;
      const now = getAudioCtx().currentTime;
      playTone(523.25, 'sine', now, 0.14, 0.18, 783.99);
      playTone(1046.5, 'triangle', now + 0.04, 0.11, 0.09);
    }

    function soundMinus() {
      if (!state.sound) return;
      const now = getAudioCtx().currentTime;
      playTone(440.0, 'triangle', now, 0.16, 0.18, 277.18);
    }

    function soundReset() {
      if (!state.sound) return;
      const now = getAudioCtx().currentTime;
      playTone(587.33, 'sine', now, 0.09, 0.14, 392.0);
      playTone(392.0, 'sine', now + 0.08, 0.16, 0.14, 261.63);
    }

    function soundStepSelect(stepVal) {
      if (!state.sound) return;
      const now = getAudioCtx().currentTime;
      const baseFreq = stepVal === 10 ? 659.25 : stepVal === 5 ? 587.33 : 523.25;
      playTone(baseFreq, 'sine', now, 0.09, 0.12, baseFreq * 1.15);
    }

    function soundHalfMilestone() {
      if (!state.sound) return;
      const now = getAudioCtx().currentTime;
      const notes = [523.25, 659.25, 783.99];
      notes.forEach((n, i) => {
        playTone(n, 'triangle', now + i * 0.09, 0.24, 0.18);
        playTone(n * 2, 'sine', now + i * 0.09, 0.2, 0.06);
      });
    }

    function soundFullMilestone() {
      if (!state.sound) return;
      const now = getAudioCtx().currentTime;
      const fanfare = [
        { f: 523.25, t: 0.00, d: 0.16 },
        { f: 659.25, t: 0.08, d: 0.16 },
        { f: 783.99, t: 0.16, d: 0.16 },
        { f: 1046.50, t: 0.25, d: 0.45 },
        { f: 1318.51, t: 0.28, d: 0.45 },
        { f: 1567.98, t: 0.31, d: 0.50 }
      ];
      fanfare.forEach(item => {
        playTone(item.f, 'triangle', now + item.t, item.d, 0.17);
        playTone(item.f, 'sine', now + item.t, item.d, 0.10);
      });
    }

    function spawnParticles(level) {
      const rect = counterStage.getBoundingClientRect();
      const originX = rect.left + rect.width / 2;
      const originY = rect.top + rect.height / 2;

      const isFull = level === 'full';
      const isHalf = level === 'half';
      const count = isFull ? 48 : isHalf ? 26 : 8;
      const shapes = isFull
        ? PARTICLE_CONFIG.full
        : isHalf
          ? PARTICLE_CONFIG.half
          : PARTICLE_CONFIG.step;

      for (let i = 0; i < count; i++) {
        const el = document.createElement('span');
        el.className = 'confetti-piece';

        const shape = shapes[Math.floor(Math.random() * shapes.length)];
        const color = PARTICLE_CONFIG.colors[Math.floor(Math.random() * PARTICLE_CONFIG.colors.length)];
        el.textContent = shape;
        el.style.color = color;
        el.style.fontSize = (isFull ? (20 + Math.random() * 16) : isHalf ? (18 + Math.random() * 12) : (16 + Math.random() * 9)) + 'px';

        const angle = (Math.PI * 2 * i) / count + (Math.random() - 0.5) * 0.5;
        const distance = isFull
          ? (115 + Math.random() * 215)
          : isHalf
            ? (70 + Math.random() * 115)
            : (42 + Math.random() * 68);
        const tx = Math.cos(angle) * distance;
        const ty = Math.sin(angle) * distance - (isFull ? 42 : isHalf ? 24 : 18);
        const rot = (Math.random() - 0.5) * 720;

        el.style.left = originX + 'px';
        el.style.top = originY + 'px';
        el.style.setProperty('--tx', `${tx}px`);
        el.style.setProperty('--ty', `${ty}px`);
        el.style.setProperty('--rot', `${rot}deg`);
        el.style.setProperty('--dur', (isFull ? (1.25 + Math.random() * 0.7) : isHalf ? (0.9 + Math.random() * 0.4) : (0.65 + Math.random() * 0.25)) + 's');

        fxLayer.appendChild(el);
        setTimeout(() => el.remove(), 2100);
      }
    }

    function spawnDeltaBubble(delta) {
      const bubble = document.createElement('span');
      bubble.className = 'delta-pop';
      bubble.textContent = delta > 0 ? `+${delta}` : `${delta}`;
      const rootStyle = getComputedStyle(document.documentElement);
      bubble.style.color = (delta > 0 ? rootStyle.getPropertyValue('--delta-up') : rootStyle.getPropertyValue('--delta-down')).trim();
      bubble.style.left = (45 + Math.random() * 10) + '%';
      bubble.style.top = '38%';
      counterStage.appendChild(bubble);
      setTimeout(() => bubble.remove(), 720);
    }

    function triggerClassAnim(el, className) {
      el.classList.remove('anim-up', 'anim-down', 'anim-reset', 'anim-half', 'anim-full', 'celebrate-half', 'celebrate-full');
      void el.offsetWidth;
      el.classList.add(className);
    }

    function render(actionType = null, prevCount = state.count) {
      if (document.activeElement !== counterTitleInput) {
        counterTitleInput.value = state.title || 'My Project Counter';
      }

      counterDisplay.textContent = state.count.toLocaleString('id-ID');
      soundToggle.textContent = state.sound ? '🔊' : '🔇';

      document.documentElement.dataset.theme = state.theme;
      themeToggle.textContent = state.theme === 'blue' ? '🌸' : '💙';
      themeToggle.title = state.theme === 'blue' ? 'Ganti ke tema Pink' : 'Ganti ke tema Biru';

      stepPills.forEach(btn => {
        const btnStep = Number(btn.dataset.step);
        const isActive = btnStep === Number(state.step);
        btn.classList.toggle('active', isActive);
        btn.setAttribute('aria-pressed', String(isActive));
      });

      const target = Number(state.target);
      if (document.activeElement !== targetInput) {
        targetInput.value = target > 0 ? target : '';
      }

      let pct = 0;
      let prevPct = 0;
      if (target > 0) {
        pct = Math.max(0, Math.round((state.count / target) * 100));
        prevPct = Math.max(0, Math.round((prevCount / target) * 100));
        targetStatusText.textContent = `Target: ${target.toLocaleString('id-ID')}`;
        targetPercentText.textContent = `${pct}%`;
        progressFill.style.width = `${Math.min(100, pct)}%`;
      } else {
        targetStatusText.textContent = 'Target: Belum diatur';
        targetPercentText.textContent = '—';
        progressFill.style.width = '0%';
      }

      progressFill.classList.remove('half-reached', 'full-reached');
      milestoneBanner.classList.remove('show', 'half', 'full');

      if (target > 0 && pct >= 100) {
        progressFill.classList.add('full-reached');
        milestoneBanner.textContent = '🎉 Target 100% Tercapai! Selamat!';
        milestoneBanner.classList.add('show', 'full');
      } else if (target > 0 && pct >= 50) {
        progressFill.classList.add('half-reached');
        milestoneBanner.textContent = '✨ Sudah setengah jalan! Semangat!';
        milestoneBanner.classList.add('show', 'half');
      }

      const crossed100 = actionType === 'plus' && target > 0 && prevPct < 100 && pct >= 100;
      const crossed50 = actionType === 'plus' && target > 0 && prevPct < 50 && pct >= 50 && pct < 100;

      if (crossed100) {
        triggerClassAnim(counterDisplay, 'anim-full');
        triggerClassAnim(mainCard, 'celebrate-full');
        soundFullMilestone();
        spawnParticles('full');
      } else if (crossed50) {
        triggerClassAnim(counterDisplay, 'anim-half');
        triggerClassAnim(mainCard, 'celebrate-half');
        soundHalfMilestone();
        spawnParticles('half');
      } else if (actionType === 'plus') {
        triggerClassAnim(counterDisplay, 'anim-up');
        soundPlus();
        spawnParticles('step');
      } else if (actionType === 'minus') {
        triggerClassAnim(counterDisplay, 'anim-down');
        soundMinus();
      } else if (actionType === 'reset') {
        triggerClassAnim(counterDisplay, 'anim-reset');
        soundReset();
      }

      saveState();
    }

    function increment() {
      const stepValue = ALLOWED_STEPS.includes(Number(state.step)) ? Number(state.step) : 1;
      const prev = state.count;
      state.count += stepValue;
      spawnDeltaBubble(stepValue);
      render('plus', prev);
    }

    function decrement() {
      const stepValue = ALLOWED_STEPS.includes(Number(state.step)) ? Number(state.step) : 1;
      const prev = state.count;
      state.count = Math.max(0, state.count - stepValue);
      if (prev !== state.count) {
        spawnDeltaBubble(-(prev - state.count));
      }
      render('minus', prev);
    }

    btnPlus.addEventListener('click', increment);
    btnMinus.addEventListener('click', decrement);

    function selectStep(newStep) {
      const parsedStep = Number(newStep);
      if (!ALLOWED_STEPS.includes(parsedStep)) return;
      state.step = parsedStep;
      soundStepSelect(parsedStep);
      render();
    }

    stepPillsContainer.addEventListener('click', (e) => {
      const pill = e.target.closest('.step-pill');
      if (!pill) return;
      selectStep(pill.dataset.step);
    });

    targetInput.addEventListener('input', (e) => {
      const val = parseInt(e.target.value, 10);
      state.target = val > 0 ? val : 0;
      render();
    });

    soundToggle.addEventListener('click', () => {
      state.sound = !state.sound;
      if (state.sound) soundPlus();
      render();
    });

    themeToggle.addEventListener('click', () => {
      state.theme = state.theme === 'blue' ? 'pink' : 'blue';
      soundStepSelect(5);
      render();
    });

    counterTitleInput.addEventListener('input', (e) => {
      state.title = e.target.value;
      saveState();
    });

    counterTitleInput.addEventListener('blur', () => {
      if (!state.title.trim()) {
        state.title = 'My Project Counter';
        counterTitleInput.value = state.title;
        saveState();
      }
    });

    counterTitleInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        counterTitleInput.blur();
      }
    });

    editTitleBtn.addEventListener('click', () => {
      counterTitleInput.focus();
      counterTitleInput.select();
    });

    btnReset.addEventListener('click', () => {
      resetModal.classList.add('open');
    });

    cancelReset.addEventListener('click', () => {
      resetModal.classList.remove('open');
    });

    confirmReset.addEventListener('click', () => {
      const prev = state.count;
      state.count = 0;
      resetModal.classList.remove('open');
      render('reset', prev);
    });

    resetModal.addEventListener('click', (e) => {
      if (e.target === resetModal) resetModal.classList.remove('open');
    });

    document.addEventListener('keydown', (e) => {
      if (document.activeElement === targetInput || document.activeElement === counterTitleInput) return;
      if (resetModal.classList.contains('open')) {
        if (e.key === 'Escape') resetModal.classList.remove('open');
        if (e.key === 'Enter') confirmReset.click();
        return;
      }

      if (e.code === 'Space' || e.key === 'ArrowUp') {
        e.preventDefault();
        increment();
      } else if (e.key === 'ArrowDown') {
        e.preventDefault();
        decrement();
      } else if (e.key.toLowerCase() === 'r') {
        resetModal.classList.add('open');
      }
    });

    render();
  </script>
</body>
</html>
